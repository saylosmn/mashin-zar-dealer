# Auto car аппыг автоматаар шинэчлэх (EAS Update):
#  mobile/ эсвэл shared/ доторх код main руу push хийгдэх бүрт → EAS Update (preview channel).
#  Суулгасан апп дараагийн нээлтээр шинэ кодоо татна. APK дахин суулгах шаардлагагүй.
# app.json / package.json / шинэ native сан өөрчлөгдвөл шинэ APK build хэрэгтэй (Documents\auto-car\build2.bat).
# Шаардлага: GitHub repo → Settings → Secrets and variables → Actions → EXPO_TOKEN
name: Mobile (EAS Update)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "shared/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-eas
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EAS_NO_VCS: "1"
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: EXPO_TOKEN шалгах
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN алга::GitHub → Settings → Secrets and variables → Actions → New repository secret → нэр EXPO_TOKEN (expo.dev → Access tokens-оос авсан токен)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Сангууд суулгах
        run: npm ci || npm install

      - name: EAS Update
        run: eas update --channel preview --platform android --non-interactive --message "$(git log -1 --pretty=%s)"
